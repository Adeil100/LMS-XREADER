<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      color: #fff;
    }

    header {
      background: #16213e;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    header a {
      color: #7ec8e3;
      text-decoration: none;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    header a:hover { text-decoration: underline; }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      opacity: 0.85;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-left: auto;
      align-items: center;
      font-size: 0.85rem;
    }

    .controls button {
      background: rgba(126,200,227,0.2);
      color: #7ec8e3;
      border: 1px solid #7ec8e3;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .controls button:hover { background: rgba(126,200,227,0.35); }
    .controls button:disabled { opacity: 0.5; cursor: not-allowed; }

    #viewer {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
    }

    #canvas {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    #loading {
      position: absolute;
      inset: 60px 0 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #1a1a2e;
      color: rgba(255,255,255,0.6);
      font-size: 0.95rem;
      pointer-events: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #7ec8e3;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>

  <header>
    <a href="index.html">← Back</a>
    <h1>� PDF Viewer — Science Student Book</h1>
    <div class="controls">
      <button id="prevBtn" onclick="previousPage()">← Prev</button>
      <span id="pageNum">Page 1 / 1</span>
      <button id="nextBtn" onclick="nextPage()">Next →</button>
    </div>
  </header>

  <div id="loading">
    <div class="spinner"></div>
    <span>Loading PDF… this may take a moment</span>
  </div>

  <div id="viewer">
    <canvas id="canvas"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

    const pdfUrl = 'https://corsproxy.io/?https://github.com/Adeil100/LMS-XREADER/releases/download/v1.0.0/cls5_F2_Science_StudentBook.1.1.pdf';
    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const renderPage = (num) => {
      pageRendering = true;
      pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale: 1.5 });
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        const renderContext = { canvasContext: ctx, viewport: viewport };
        page.render(renderContext).promise.then(() => {
          pageRendering = false;
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
          document.getElementById('loading').style.display = 'none';
        });
      });
      document.getElementById('pageNum').textContent = `Page ${num} / ${pdfDoc.numPages}`;
      document.getElementById('prevBtn').disabled = num <= 1;
      document.getElementById('nextBtn').disabled = num >= pdfDoc.numPages;
    };

    const queuePage = (num) => {
      if (num < 1 || num > pdfDoc.numPages) return;
      pageNum = num;
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    };

    const nextPage = () => queuePage(pageNum + 1);
    const previousPage = () => queuePage(pageNum - 1);

    pdfjsLib.getDocument(pdfUrl).promise.then(doc => {
      pdfDoc = doc;
      renderPage(pageNum);
    }).catch(err => {
      document.getElementById('loading').innerHTML = '<span style="color: #ff6b6b;">Failed to load PDF. Please try again.</span>';
      console.error(err);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextPage();
      if (e.key === 'ArrowLeft') previousPage();
    });
  </script>

</body>
</html>

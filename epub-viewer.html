<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EPUB Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      color: #fff;
    }

    header {
      background: #16213e;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    header a {
      color: #7ec8e3;
      text-decoration: none;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    header a:hover { text-decoration: underline; }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      opacity: 0.85;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-left: auto;
      align-items: center;
      font-size: 0.85rem;
    }

    .controls button {
      background: rgba(126,200,227,0.2);
      color: #7ec8e3;
      border: 1px solid #7ec8e3;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .controls button:hover { background: rgba(126,200,227,0.35); }
    .controls button:disabled { opacity: 0.5; cursor: not-allowed; }

    #viewer {
      flex: 1;
      overflow: auto;
      padding: 20px;
    }

    #viewer {
      flex: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    #pageFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">← Back</a>
    <h1>📗 EPUB Viewer — Grade 10 Term 3</h1>
    <div class="controls">
      <button id="prevBtn" onclick="prevPage()">← Prev</button>
      <span id="pageNum">Page 1 / 9</span>
      <button id="nextBtn" onclick="nextPage()">Next →</button>
    </div>
  </header>

  <div id="viewer">
    <iframe id="pageFrame" src="Payload/1.1.1/OEBPS/assets/1/page.xhtml"></iframe>
  </div>

  <script>
    const totalPages = 9;
    let currentPage = 1;

    function goToPage(n) {
      if (n < 1 || n > totalPages) return;
      currentPage = n;
      document.getElementById('pageFrame').src = `Payload/1.1.1/OEBPS/assets/${currentPage}/page.xhtml`;
      document.getElementById('pageNum').textContent = `Page ${currentPage} / ${totalPages}`;
      document.getElementById('prevBtn').disabled = currentPage <= 1;
      document.getElementById('nextBtn').disabled = currentPage >= totalPages;
    }

    function nextPage() { goToPage(currentPage + 1); }
    function prevPage() { goToPage(currentPage - 1); }

    // init button state
    document.getElementById('prevBtn').disabled = true;

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextPage();
      if (e.key === 'ArrowLeft') prevPage();
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EPUB Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      color: #fff;
    }

    header {
      background: #16213e;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    header a {
      color: #7ec8e3;
      text-decoration: none;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    header a:hover { text-decoration: underline; }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      opacity: 0.85;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-left: auto;
      align-items: center;
      font-size: 0.85rem;
    }

    .controls button {
      background: rgba(126,200,227,0.2);
      color: #7ec8e3;
      border: 1px solid #7ec8e3;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .controls button:hover { background: rgba(126,200,227,0.35); }
    .controls button:disabled { opacity: 0.5; cursor: not-allowed; }

    #viewer {
      flex: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background:
        radial-gradient(circle at top, rgba(126,200,227,0.14), transparent 34%),
        linear-gradient(180deg, #111827 0%, #090b12 100%);
    }

    .bookPanel {
      width: 567px;
      height: 780px;
      max-width: 100%;
      max-height: 100%;
      padding: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
    }

    .pageShell {
      position: relative;
      height: 100%;
      overflow: hidden;
      border-radius: 0;
      background: #ffffff;
      box-shadow: none;
    }

    .pageShell::before {
      content: '';
      position: absolute;
      inset: 0;
      border: none;
      border-radius: 0;
      pointer-events: none;
      z-index: 2;
    }

    #pageFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    .pageLabel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 3;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(17, 24, 39, 0.72);
      color: #fff;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: none;
    }

    #interactiveModal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(6, 8, 14, 0.82);
      z-index: 9999;
      padding: 24px;
    }

    #interactiveModal.open {
      display: flex;
    }

    .modalPanel {
      position: relative;
      width: min(96vw, 1100px);
      height: min(88vh, 820px);
      border-radius: 22px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 35px 120px rgba(0, 0, 0, 0.6);
    }

    .modalClose {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 1.35rem;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    .modalClose:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    #interactiveFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    @media (max-width: 980px) {
      .bookPanel {
        width: min(567px, 100%);
        height: min(780px, 100%);
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">← Back</a>
    <h1>📗 EPUB Viewer — Business Grade 10 Term 3</h1>
    <div class="controls">
      <button id="prevBtn" onclick="prevPage()">← Prev</button>
      <span id="pageNum">Page 1 / 110</span>
      <button id="nextBtn" onclick="nextPage()">Next →</button>
    </div>
  </header>

  <div id="viewer">
    <div class="bookPanel" aria-label="Single centered page">
      <div class="pageShell">
        <div class="pageLabel">Page</div>
        <iframe id="pageFrame" src="book/Grade_10_Unit_1-1.xhtml"></iframe>
      </div>
    </div>
  </div>

  <div id="interactiveModal" aria-hidden="true">
    <div class="modalPanel" role="dialog" aria-modal="true" aria-label="Interactive content">
      <button class="modalClose" id="closeInteractive" aria-label="Close interactive content">×</button>
      <iframe id="interactiveFrame" allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe>
    </div>
  </div>

      'book/Grade_10_Unit_4-23.xhtml'
    ];

    const pageFrame = document.getElementById('pageFrame');
    const pageNum = document.getElementById('pageNum');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const interactiveModal = document.getElementById('interactiveModal');
    const interactiveFrame = document.getElementById('interactiveFrame');
    const closeInteractive = document.getElementById('closeInteractive');

    let currentPage = 0;

    function findMappedVideoUrl(text) {
      if (!text) return null;
      const match = text.match(/G10_[A-Za-z0-9_]+\.mp4/i);
      if (!match) return null;
      return videoMappings[match[0]] || null;
    }

    function buildVideoPlayerHtml(url) {
      return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}body{display:flex;align-items:center;justify-content:center}video{width:100%;height:100%;max-width:100%;max-height:100%;background:#000}</style></head><body><video controls autoplay playsinline><source src="${url}" type="video/mp4"></video></body></html>`;
    }

    function openInteractiveFrame(url) {
      interactiveFrame.srcdoc = buildVideoPlayerHtml(url);
      interactiveModal.classList.add('open');
      interactiveModal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeInteractiveFrame() {
      interactiveFrame.srcdoc = '';
      interactiveModal.classList.remove('open');
      interactiveModal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    function hookIframeInteractions(iframe) {
      const doc = iframe.contentDocument;
      if (!doc) return;

      // Keep each EPUB document in fixed-page mode with no wheel scrolling.
      doc.documentElement.style.overflow = 'hidden';
      if (doc.body) doc.body.style.overflow = 'hidden';

      doc.querySelectorAll('a[href]').forEach((anchor) => {
        const href = anchor.getAttribute('href') || '';
        const mappedUrl = findMappedVideoUrl(href);
        if (mappedUrl) {
          anchor.setAttribute('href', mappedUrl);
          anchor.setAttribute('target', '_blank');
          anchor.setAttribute('rel', 'noopener noreferrer');
        }
      });

      doc.addEventListener('click', (event) => {
        const anchor = event.target.closest('a[href]');
        if (!anchor) return;

        const href = anchor.getAttribute('href') || '';
        const mappedUrl = findMappedVideoUrl(href);
        if (!mappedUrl) return;

        event.preventDefault();
        event.stopPropagation();
        openInteractiveFrame(mappedUrl);
      }, true);

      doc.addEventListener('wheel', (event) => {
        event.preventDefault();
      }, { passive: false });
    }

    function updatePageInfo() {
      pageNum.textContent = `Page ${currentPage + 1} / ${pages.length}`;
      prevBtn.disabled = currentPage <= 0;
      nextBtn.disabled = currentPage >= pages.length - 1;
    }

    function loadPage() {
      pageFrame.src = pages[currentPage];
      updatePageInfo();
    }

    function goToPage(n) {
      if (n < 0 || n >= pages.length) return;
      currentPage = n;
      loadPage();
    }

    function nextPage() {
      goToPage(currentPage + 1);
    }

    function prevPage() {
      goToPage(currentPage - 1);
    }

    pageFrame.addEventListener('load', () => hookIframeInteractions(pageFrame));
    closeInteractive.addEventListener('click', closeInteractiveFrame);
    interactiveModal.addEventListener('click', (event) => {
      if (event.target === interactiveModal) closeInteractiveFrame();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && interactiveModal.classList.contains('open')) {
        closeInteractiveFrame();
        return;
      }
      if (event.key === 'ArrowRight') nextPage();
      if (event.key === 'ArrowLeft') prevPage();
      if (event.key === 'ArrowDown') nextPage();
      if (event.key === 'ArrowUp') prevPage();
    });

    goToPage(0);
  </script>

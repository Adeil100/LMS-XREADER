<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EPUB Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      color: #fff;
    }

    header {
      background: #16213e;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    header a {
      color: #7ec8e3;
      text-decoration: none;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    header a:hover { text-decoration: underline; }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      opacity: 0.85;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-left: auto;
      align-items: center;
      font-size: 0.85rem;
    }

    .controls button {
      background: rgba(126,200,227,0.2);
      color: #7ec8e3;
      border: 1px solid #7ec8e3;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .controls button:hover { background: rgba(126,200,227,0.35); }
    .controls button:disabled { opacity: 0.5; cursor: not-allowed; }

    #viewer {
      flex: 1;
      overflow: auto;
      padding: 20px;
    }

    #viewer {
      flex: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    #pageFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">← Back</a>
    <h1>📗 EPUB Viewer — Business Grade 10 Term 3</h1>
    <div class="controls">
      <button id="prevBtn" onclick="prevPage()">← Prev</button>
      <span id="pageNum">Page 1 / 110</span>
      <button id="nextBtn" onclick="nextPage()">Next →</button>
    </div>
  </header>

  <div id="viewer">
    <iframe id="pageFrame" src="book/Grade_10_Unit_1-1.xhtml"></iframe>
  </div>

  <script>
    const RELEASES_BASE_URL = 'https://github.com/Adeil100/LMS-XREADER/releases/download/videos-v1';
    const videoMappings = {
      'G10_U1_Boys.mp4': `${RELEASES_BASE_URL}/G10_U1_Boys.mp4`,
      'G10_U1_Girls.mp4': `${RELEASES_BASE_URL}/G10_U1_Girls.mp4`,
      'G10_U2_Boys.mp4': `${RELEASES_BASE_URL}/G10_U2_Boys.mp4`,
      'G10_U2_Girls.mp4': `${RELEASES_BASE_URL}/G10_U2_Girls.mp4`,
      'G10_U3_Boys.mp4': `${RELEASES_BASE_URL}/G10_U3_Boys.mp4`,
      'G10_U3_Girls.mp4': `${RELEASES_BASE_URL}/G10_U3_Girls.mp4`,
      'G10_U4_Boys.mp4': `${RELEASES_BASE_URL}/G10_U4_Boys.mp4`,
      'G10_U4_Girls.mp4': `${RELEASES_BASE_URL}/G10_U4_Girls.mp4`
    };

    function findMappedVideoUrl(text) {
      if (!text) return null;
      const match = text.match(/G10_[A-Za-z0-9_]+\.mp4/i);
      if (!match) return null;
      return videoMappings[match[0]] || null;
    }

    function rewriteIframeVideoLinks() {
      const iframe = document.getElementById('pageFrame');
      if (!iframe || !iframe.contentDocument) return;

      const doc = iframe.contentDocument;

      doc.querySelectorAll('a[href]').forEach((anchor) => {
        const href = anchor.getAttribute('href');
        const mappedUrl = findMappedVideoUrl(href);
        if (mappedUrl) {
          anchor.setAttribute('href', `javascript:window.open('${mappedUrl}')`);
        }
      });

      doc.querySelectorAll('video[src], source[src]').forEach((media) => {
        const src = media.getAttribute('src');
        const mappedUrl = findMappedVideoUrl(src);
        if (mappedUrl) {
          media.setAttribute('src', mappedUrl);
        }
      });
    }

      'book/Grade_10_Unit_4-22.xhtml',
      'book/Grade_10_Unit_4-23.xhtml'
    ];
    
    let currentPage = 0;
    const pageFrame = document.getElementById('pageFrame');

    pageFrame.addEventListener('load', () => {
      rewriteIframeVideoLinks();
    });

    function goToPage(n) {
      if (n < 0 || n >= pages.length) return;
      currentPage = n;
      document.getElementById('pageFrame').src = pages[currentPage];
      document.getElementById('pageNum').textContent = `Page ${currentPage + 1} / ${pages.length}`;
      document.getElementById('prevBtn').disabled = currentPage <= 0;
      document.getElementById('nextBtn').disabled = currentPage >= pages.length - 1;
    }

    function nextPage() { goToPage(currentPage + 1); }
    function prevPage() { goToPage(currentPage - 1); }

    goToPage(0);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextPage();
      if (e.key === 'ArrowLeft') prevPage();
    });

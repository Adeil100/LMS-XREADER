<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Book Access</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f2942 0%, #1a5276 60%, #0e6655 100%);
      padding: 32px 16px;
      color: #fff;
    }

    .hero {
      text-align: center;
      margin-bottom: 48px;
    }

    .hero h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 1.05rem;
      opacity: 0.75;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      width: 100%;
      max-width: 860px;
    }

    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-decoration: none;
      width: 240px;
      padding: 36px 24px;
      border-radius: 18px;
      border: 2px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(10px);
      color: #fff;
      font-weight: 600;
      font-size: 1.05rem;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
      cursor: pointer;
    }

    .btn:hover, .btn:focus {
      background: rgba(255,255,255,0.22);
      border-color: rgba(255,255,255,0.5);
      transform: translateY(-4px);
      outline: none;
    }

    .btn .icon {
      font-size: 2.8rem;
      line-height: 1;
    }

    .btn .label {
      font-size: 1.1rem;
      letter-spacing: 0.2px;
    }

    .btn .sub {
      font-size: 0.82rem;
      opacity: 0.7;
      font-weight: 400;
    }

    .btn-reader  { border-color: rgba(82,190,128,0.5);  }
    .btn-pdf     { border-color: rgba(231,76,60,0.5);   }
    .btn-epub    { border-color: rgba(52,152,219,0.5);  }

    .btn-reader:hover  { border-color: rgba(82,190,128,0.9);  background: rgba(82,190,128,0.18);  }
    .btn-pdf:hover     { border-color: rgba(231,76,60,0.9);   background: rgba(231,76,60,0.18);   }
    .btn-epub:hover    { border-color: rgba(52,152,219,0.9);  background: rgba(52,152,219,0.18);  }

    footer {
      margin-top: 52px;
      font-size: 0.8rem;
      opacity: 0.45;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="hero">
    <h1>Digital Book Access</h1>
    <p>Choose how you want to read the book</p>
  </div>

  <div class="buttons">

    <a class="btn btn-reader" href="index-standalone.html">
      <span class="icon">✨</span>
      <span class="label">after transormation</span>
      <span class="sub">Interactive reader</span>
    </a>

    <a class="btn btn-pdf" href="pdf-viewer.html">
      <span class="icon">📕</span>
      <span class="label">PDF books</span>
      <span class="sub">View PDF in browser</span>
    </a>

    <a class="btn btn-epub" href="epub-viewer.html">
      <span class="icon">📗</span>
      <span class="label">Epub for MoE</span>
      <span class="sub">View EPUB in browser</span>
    </a>

  </div>

  <footer>Hosted on GitHub Pages &mdash; <span id="footerUrl"></span></footer>

  <script>
    document.getElementById("footerUrl").textContent = window.location.href.replace(/index\.html?(\?.*)?$/i, "");
  </script>

</body>
</html>
